services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_INTERNAL_URL=http://backend:8000
    healthcheck:
      test: curl -s http://localhost:3000/api/health | grep -q 'ok' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - backend-network
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: curl -s http://localhost/health | grep -q 'ok' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - backend-network
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # expose:
    #   - "5432"
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hse_prospective_students
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hse_prospective_students
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SECRET_KEY=${SECRET_KEY:-compose-dev-secret-change-me}
    # command: ["sh", "-c", "export PYTHONPATH=$PYTHONPATH:. && alembic upgrade head"]
    networks:
      - backend-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hse_prospective_students
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SECRET_KEY=${SECRET_KEY:-compose-dev-secret-change-me}
    # environment:
    #    - DB_=3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: curl -s http://localhost:8000/ | grep -q 'HSE Prospective Students API' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend-network
  ai-proxy:
    image: python:3.13-alpine
    command: sh -c "pip install fastapi uvicorn httpx && uvicorn ai_proxy:app --host 0.0.0.0 --port 9000"
    volumes:
      - ./ai_proxy.py:/ai_proxy.py
    networks:
      - backend-network
networks:
  backend-network:
    driver: bridge
